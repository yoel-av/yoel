<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7efe4">
<title>רשימת קניות</title>
<style>
  :root {
    --bg: #f7efe4;
    --card: #fffaf3;
    --text: #3d2b1f;
    --muted: #8a7363;
    --border: #e6d5c3;
    --accent: #d9732b;
    --accent-press: #b95f1f;
    --done-bg: #f0e6d8;
    --check: #6f9a4a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Heebo", Arial, sans-serif;
    font-size: 18px;
    line-height: 1.5;
    padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 28px; margin: 4px 0 16px; text-align: center; }
  .hidden { display: none !important; }

  textarea {
    width: 100%;
    min-height: 45vh;
    padding: 16px;
    font: inherit;
    font-size: 18px; /* 16px ומעלה מונע זום אוטומטי באייפון */
    color: var(--text);
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 16px;
    resize: vertical;
    outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--muted); }

  .buttons { display: flex; gap: 12px; margin-top: 16px; }
  button {
    flex: 1;
    min-height: 60px;
    border: none;
    border-radius: 16px;
    font: inherit;
    font-size: 20px;
    font-weight: 600;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform .08s ease, background-color .15s ease;
  }
  button:active { transform: scale(.97); }
  .primary { background: var(--accent); color: #fff; }
  .primary:active { background: var(--accent-press); }
  .secondary { background: var(--card); color: var(--text); border: 2px solid var(--border); }

  .summary { text-align: center; color: var(--muted); margin: 0 0 12px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  li {
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 60px;
    padding: 12px 16px;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 16px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: background-color .15s ease, opacity .15s ease;
  }
  .box {
    flex: none;
    width: 30px;
    height: 30px;
    border: 2px solid var(--accent);
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: #fff;
    font-size: 18px;
  }
  li.done { background: var(--done-bg); opacity: .7; }
  li.done .text { text-decoration: line-through; color: var(--muted); }
  li.done .box { background: var(--check); border-color: var(--check); }
  li.done .box::after { content: "✓"; }
</style>
</head>
<body>
<main>
  <h1>רשימת קניות</h1>

  <section id="input-view">
    <textarea id="input" placeholder="הדביקו כאן את הרשימה, כל פריט בשורה"></textarea>
    <div class="buttons">
      <button id="create" class="primary">צור רשימה</button>
    </div>
  </section>

  <section id="list-view" class="hidden">
    <p id="summary" class="summary"></p>
    <ul id="list"></ul>
    <div class="buttons">
      <button id="clear" class="secondary">נקה</button>
    </div>
  </section>
</main>

<script>
  const KEY = "shopping-list";
  const input = document.getElementById("input");
  const list = document.getElementById("list");
  const summary = document.getElementById("summary");
  const inputView = document.getElementById("input-view");
  const listView = document.getElementById("list-view");
  let items = [];

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {}
  }

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; }
  }

  function updateSummary() {
    const bought = items.filter(i => i.done).length;
    summary.textContent = bought === items.length
      ? "הכול נקנה"
      : `נקנו ${bought} מתוך ${items.length}`;
  }

  function render() {
    list.innerHTML = "";
    items.forEach((item, idx) => {
      const li = document.createElement("li");
      li.className = item.done ? "done" : "";
      li.innerHTML = '<span class="box"></span><span class="text"></span>';
      li.querySelector(".text").textContent = item.text;
      li.addEventListener("click", () => {
        item.done = !item.done;
        li.classList.toggle("done", item.done);
        updateSummary();
        save();
      });
      list.appendChild(li);
    });
    updateSummary();
    inputView.classList.toggle("hidden", items.length > 0);
    listView.classList.toggle("hidden", items.length === 0);
  }

  document.getElementById("create").addEventListener("click", () => {
    items = input.value
      .split(/\r?\n/)
      .map(line => line.replace(/^\s*([-*•·]|\d+[.)])\s*/, "").trim())
      .filter(Boolean)
      .map(text => ({ text, done: false }));
    if (!items.length) { input.focus(); return; }
    input.blur();
    save();
    render();
    window.scrollTo(0, 0);
  });

  document.getElementById("clear").addEventListener("click", () => {
    if (!confirm("לנקות את הרשימה ולהתחיל מחדש?")) return;
    items = [];
    input.value = "";
    save();
    render();
  });

  items = load();
  render();
</script>
</body>
</html>
